<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1d3a" />
    <title>You are offline | Closer to the Father</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b1d3a; color: #f5efe0; font: 18px/1.6 system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 32rem; text-align: center; }
      h1 { font-family: Georgia, serif; font-weight: 500; font-size: 2rem; margin: 0 0 12px; }
      blockquote { font-family: Georgia, serif; font-style: italic; font-size: 1.3rem; border-left: 2px solid #d4a853; margin: 28px 0; padding-left: 16px; text-align: left; }
      cite { display: block; color: #d4a853; font-style: normal; font-weight: 600; font-size: 1rem; margin-top: 6px; }
      button { background: #d4a853; color: #0b1d3a; border: 0; border-radius: 12px; font: 600 1.05rem system-ui, sans-serif; padding: 14px 24px; min-height: 48px; cursor: pointer; }
      p { color: #a9b6c9; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>No connection right now. That is okay. God hears you with or without Wi-Fi.</p>
      <blockquote>"Be still, and know that I am God."<cite>Psalm 46:10a</cite></blockquote>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
